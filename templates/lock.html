{{define "lock.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart2FA — Unlock</title>
  <meta name="description" content="Smart2FA — minimal self-hosted 2FA manager. Unlock your vault with your phrase and passcode."/>
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#7c6eff"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Smart2FA"/>
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png"/>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body class="lock-page">
  <div class="lock-bg">
    <div class="lock-orb lock-orb-1"></div>
    <div class="lock-orb lock-orb-2"></div>
  </div>

  <div class="lock-card glass">
    <div class="lock-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="lock-title">Smart<span class="accent">2FA</span></h1>
    <p class="lock-subtitle">Minimal · Self-hosted · Private</p>

    {{if .Error}}
    <div class="alert-error">{{.Error}}</div>
    {{end}}

    <form id="unlock-form" action="/unlock" method="POST" class="unlock-form">
      <div class="field-group">
        <label for="phrase">Phrase</label>
        <input id="phrase" type="text" name="phrase" placeholder="your secret phrase"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required/>
      </div>

      <div class="field-group">
        <label for="passcode">Passcode</label>
        <input id="passcode" type="password" name="passcode" placeholder="0000"
               autocomplete="off" maxlength="20" required/>
      </div>

      <button id="unlock-btn" type="submit" class="btn-primary btn-full">
        <span class="btn-text">Unlock Vault</span>
        <span class="btn-spinner hidden"></span>
      </button>
    </form>

    <p class="lock-hint">New phrase+passcode combination creates a new vault.</p>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
